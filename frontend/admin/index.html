<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>店舗管理</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="container">
    <header class="admin-header">
      <h1 class="title"><span id="shop-name"></span> 店舗管理</h1>
      <p id="whoami" class="hint"></p>
    </header>

    <section id="view-loading" class="card center">
      <div class="spinner" aria-hidden="true"></div>
      <p>読み込み中…</p>
    </section>

    <section id="view-error" class="card" hidden>
      <p id="error-message" class="error-text" role="alert"></p>
    </section>

    <section id="view-register" class="card" hidden>
      <h2>初回登録</h2>
      <p>オーナーから受け取った招待コードを入力してください。</p>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="invite-code">招待コード</label>
          <input id="invite-code" type="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="XXXXX-XXXXX" required>
          <p class="field-error" data-for="code"></p>
        </div>
        <button type="submit" class="btn primary">登録する</button>
      </form>
    </section>

    <section id="view-app" hidden>
      <div class="date-bar card">
        <label for="business-date">営業日</label>
        <input id="business-date" type="date">
        <button type="button" id="btn-today" class="btn small">今日</button>
      </div>
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
      <div id="panel" class="panel"></div>
    </section>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
